name: Check resume PDF
on:
  push:
    paths:
      - '.github/workflows/check-resume-pdf.yml'
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect PDF
        run: |
          python - <<'PY' > pdf-check.txt
          from pathlib import Path
          import hashlib
          p=Path('Lydie-Ayrault.pdf')
          b=p.read_bytes()
          print('size', len(b))
          print('sha256', hashlib.sha256(b).hexdigest())
          print('starts_pdf', b.startswith(b'%PDF-'))
          print('has_eof', b.rstrip().endswith(b'%%EOF'))
          print('pages_marker_count', b.count(b'/Type/Page'))
          PY
          file Lydie-Ayrault.pdf >> pdf-check.txt
      - name: Commit result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pdf-check.txt
          git commit -m "Record PDF validation result"
          git push

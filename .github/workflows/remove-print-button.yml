name: Remove print button

on:
  push:
    paths:
      - '.github/workflows/remove-print-button.yml'

permissions:
  contents: write

jobs:
  update-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove Print / Save PDF button
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          # Remove the visible Print / Save PDF control only.
          text = re.sub(
              r'\s*<button[^>]*class=["\']print-btn["\'][^>]*>.*?</button>\s*',
              '\n',
              text,
              flags=re.S,
          )

          # Keep the existing Download résumé button styling intact.
          text = text.replace('.print-btn,.download-btn{', '.download-btn{')
          text = text.replace('.topbar{padding:0 0 8mm}.print-btn,.download-btn{display:none}',
                              '.topbar{padding:0 0 8mm}.download-btn{display:none}')
          text = re.sub(r'\n\s*\.print-btn:hover\{[^}]*\}', '', text)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No change needed"
          else
            git commit -m "Remove Print / Save PDF button"
            git push
          fi

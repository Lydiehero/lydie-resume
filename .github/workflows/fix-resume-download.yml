name: Fix resume download link

on:
  push:
    paths:
      - '.github/workflows/fix-resume-download.yml'

permissions:
  contents: write

jobs:
  fix-link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use absolute GitHub Pages PDF URL
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old = 'href="Lydie-Ayrault.pdf" download="Lydie-Ayrault-2026.pdf"'
          new = 'href="https://lydiehero.github.io/lydie-resume/Lydie-Ayrault.pdf" target="_blank" rel="noopener"'
          if old not in text:
              raise SystemExit('Expected download link not found')
          p.write_text(text.replace(old, new), encoding='utf-8')
          PY
      - name: Commit fixed link
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Fix resume download link"
          git push

name: Update resume download

on:
  push:
    paths:
      - '.github/workflows/update-download.yml'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point download button to updated PDF
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s, n = re.subn(
              r'href="data:application/pdf;base64,[^"]+"\s+download="Lydie-Ayrault-2026\.pdf"',
              'href="Lydie-Ayrault.pdf" download="Lydie-Ayrault-2026.pdf"',
              s,
              count=1,
              flags=re.S,
          )
          if n != 1:
              raise SystemExit(f'Expected 1 download link replacement, got {n}')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Remove temporary workflow and commit
        run: |
          git rm .github/workflows/update-download.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Use updated résumé PDF download"
          git push

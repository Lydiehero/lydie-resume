name: Update portfolio WIP label

on:
  push:
    paths:
      - '.github/workflows/update-portfolio-wip.yml'

permissions:
  contents: write

jobs:
  update-page:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Remove portfolio link
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('index.html')
          text = path.read_text(encoding='utf-8')
          old = '<a href="https://www.lydiehero.com/" target="_blank" rel="noreferrer">Portfolio <span class="wip-badge">WIP</span> ↗</a>'
          new = '<span>Portfolio <span class="wip-badge">WIP</span></span>'
          if old not in text:
              raise SystemExit('Expected portfolio link not found')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Remove portfolio link and keep WIP label"
          git push

# trigger update

name: Fix resume download final

on:
  push:
    paths:
      - '.github/workflows/fix-resume-download-final.yml'

permissions:
  contents: write

jobs:
  fix-download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create fresh download file and update button
        run: |
          cp Lydie-Ayrault.pdf Lydie-Ayrault-2026.pdf
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          text = p.read_text(encoding='utf-8')
          old = '<a class="download-btn" href="https://lydiehero.github.io/lydie-resume/Lydie-Ayrault.pdf" target="_blank" rel="noopener">Download résumé (PDF) ↓</a>'
          new = '<a class="download-btn" href="Lydie-Ayrault-2026.pdf" download="Lydie-Ayrault-2026.pdf">Download résumé (PDF) ↓</a>'
          if old not in text:
              raise SystemExit('Expected download button markup not found')
          p.write_text(text.replace(old, new), encoding='utf-8')
          PY
          test -s Lydie-Ayrault-2026.pdf
          head -c 5 Lydie-Ayrault-2026.pdf | grep -q '%PDF-'

      - name: Commit fixed download
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html Lydie-Ayrault-2026.pdf
          git commit -m "Fix resume download with verified PDF"
          git push
